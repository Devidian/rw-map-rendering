services:
  rw-map-rendering:
    build: .
    container_name: rw-map-rendering
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MAP_ROOT_DIR: ${MAP_ROOT_DIR:-/appdata/rw-map-rendering/tiles}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      RENDER_SERVERS_CONFIG_FILE: /app/config/server-config.json
      RSYNC_TARGET: ${RSYNC_TARGET:-}
      RSYNC_SSH_KEY_FILE: ${RSYNC_SSH_KEY_FILE:-}
      SFTP_TARGET: ${SFTP_TARGET:-}
      SFTP_CONFIG_FILE: /app/config/rclone.conf
      SFTP_IDLE_SYNC_MS: ${SFTP_IDLE_SYNC_MS:-300000}
      SFTP_FULL_SYNC_MS: ${SFTP_FULL_SYNC_MS:-3600000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${RENDER_SERVERS_CONFIG_FILE:?Set RENDER_SERVERS_CONFIG_FILE in .env}:/app/config/server-config.json:ro
      - ${MAP_ROOT_DIR:-/appdata/rw-map-rendering/tiles}:${MAP_ROOT_DIR:-/appdata/rw-map-rendering/tiles}
      # For SFTP, mount a private rclone config and set SFTP_TARGET above:
      # - ./rclone.conf:/app/config/rclone.conf:ro
      # - ./sftp-key:/app/config/sftp-key:ro
      # - ./known_hosts:/app/config/known_hosts:ro
